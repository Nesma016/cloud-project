services:
  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - webapp

  webapp:
    image: node:18-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    command: ["sh", "-c", "npm install && npm start"]

volumes:
  caddy_data:
  caddy_config:
